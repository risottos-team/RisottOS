name: RisottOS Build

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-x86_64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso

      - name: Build x86_64 ISO
        run: make x86_64

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: risottos-x86_64-iso
          path: build/x86_64/risottos.iso

      - name: Generate next version tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: version
        run: |
          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v0.1.1"
          else
            BASE=${LATEST_TAG%.*}
            PATCH=${LATEST_TAG##*.}
            NEXT_PATCH=$((PATCH + 1))
            NEXT_TAG="$BASE.$NEXT_PATCH"
          fi
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RisottOS ${{ steps.version.outputs.tag }}
          files: build/x86_64/risottos.iso
          generate_release_notes: true
